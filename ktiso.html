<style>
  :root {
    --gold: #C9A961;
    --gold-deep: #8B6F35;
    --green: #1A2E22;
    --green-deep: #0F1A14;
    --terracotta: #C1654A;
    --lime: #A8C66C;
    --cream: #F4EFE3;
    --line: rgba(201, 169, 97, 0.22);
    --nav-height: 68px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--green-deep);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    scroll-behavior: smooth;
  }

  body {
    background:
      radial-gradient(ellipse 80% 45% at 50% -10%, rgba(201, 169, 97, 0.09), transparent),
      linear-gradient(180deg, var(--green-deep) 0%, var(--green) 100%);
    overflow-x: hidden;
  }

  a { text-decoration: none; }
  img { max-width: 100%; display: block; }

  /* ===================== NAVIGATION ===================== */
  .site-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--nav-height);
    z-index: 100;
    background: rgba(15, 26, 20, 0.55);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid transparent;
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  .site-nav.scrolled {
    background: rgba(15, 26, 20, 0.88);
    border-bottom-color: var(--line);
  }

  .nav-inner {
    max-width: 600px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }

  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.04em;
    color: var(--cream);
  }
  .nav-logo span { color: var(--gold); }

  .nav-links {
    display: flex;
    gap: 28px;
  }
  .nav-links a {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(244, 239, 227, 0.6);
    transition: color 0.25s ease;
  }
  .nav-links a:hover { color: var(--gold); }

  .nav-burger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
  }
  .nav-burger span {
    width: 20px; height: 1.5px;
    background: var(--cream);
    border-radius: 2px;
    transition: all 0.3s ease;
  }

  .nav-links-mobile {
    display: none;
    flex-direction: column;
    background: rgba(15, 26, 20, 0.97);
    border-bottom: 1px solid var(--line);
  }
  .nav-links-mobile a {
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(244, 239, 227, 0.7);
  }
  .nav-links-mobile.open { display: flex; }

  /* ===================== HERO / WORDMARK ===================== */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: var(--nav-height) 24px 40px;
    position: relative;
  }

  .hero-wordmark-wrap {
    will-change: opacity, transform;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
    margin-bottom: 26px;
  }

  .wordmark {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 14vw, 84px);
    letter-spacing: 0.04em;
    line-height: 0.9;
    color: var(--cream);
    text-shadow:
      0 1px 0 rgba(0,0,0,0.4),
      0 2px 12px rgba(201, 169, 97, 0.15),
      0 8px 30px rgba(0,0,0,0.5);
    margin-bottom: 8px;
  }
  .wordmark span { color: var(--gold); }

  .tagline {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: clamp(18px, 4vw, 22px);
    color: rgba(244, 239, 227, 0.65);
    margin-bottom: 22px;
  }

  .subhead {
    font-size: 15px;
    letter-spacing: 0.01em;
    color: rgba(244, 239, 227, 0.75);
    max-width: 340px;
    margin: 0 auto 28px;
  }

  .steps {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 5px;
    height: 26px;
    margin: 0 auto;
  }
  .steps span {
    display: block;
    width: 7px;
    background: var(--gold);
    border-radius: 1px;
  }
  .steps span:nth-child(1) { height: 30%; opacity: 0.45; }
  .steps span:nth-child(2) { height: 55%; opacity: 0.65; }
  .steps span:nth-child(3) { height: 80%; opacity: 0.85; }
  .steps span:nth-child(4) { height: 100%; opacity: 1; }

  .scroll-cue {
    position: absolute;
    bottom: 32px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: rgba(244, 239, 227, 0.4);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: opacity 0.4s ease;
  }
  .scroll-arrow {
    width: 1px; height: 30px;
    background: linear-gradient(to bottom, var(--gold), transparent);
    animation: scrollPulse 1.8s ease-in-out infinite;
  }
  @keyframes scrollPulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* ===================== FRAME (contenu centré°°) ===================== */
  .frame {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 0 24px 72px;
  }

  .cta-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 17px 34px;
    border-radius: 2px;
    width: 100%;
    max-width: 320px;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, background 0.25s ease;
  }
  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .btn-primary {
    background: var(--gold);
    color: var(--green-deep);
    box-shadow: 0 8px 24px rgba(201, 169, 97, 0.18);
    margin-bottom: 14px;
  }
  .btn-primary:hover {
    background: #DCC07E;
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(201, 169, 97, 0.28);
  }

  .btn-secondary {
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--line);
  }
  .btn-secondary:hover {
    border-color: var(--terracotta);
    color: var(--terracotta);
    transform: translateY(-2px);
  }

  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .caption {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(244, 239, 227, 0.35);
    margin-bottom: 56px;
  }

  section { margin-bottom: 44px; text-align: center; }

  .section-label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 14px;
  }

  h2 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(21px, 4.5vw, 25px);
    font-weight: 400;
    color: var(--cream);
    margin: 0 auto 14px;
    max-width: 420px;
  }

  section p {
    font-size: 14.5px;
    line-height: 1.75;
    color: rgba(244, 239, 227, 0.75);
    max-width: 420px;
    margin: 0 auto 26px;
  }

  .rule {
    width: 64px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 40px;
  }

  /* ===================== PILIERS (3 blocs) ===================== */
  .pillars-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 32px;
  }

  .pillar-card {
    position: relative;
    display: block;
    text-align: left;
    background: rgba(201, 169, 97, 0.04);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 24px 26px 26px;
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }
  .pillar-card:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    background: rgba(201, 169, 97, 0.08);
  }
  .pillar-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }
  .pillar-card h3 {
    font-family: 'Instrument Serif', serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--cream);
    margin-bottom: 8px;
  }
  .pillar-card p {
    font-size: 13px;
    line-height: 1.6;
    color: rgba(244, 239, 227, 0.65);
    margin: 0;
    max-width: none;
  }
  .pillar-arrow {
    position: absolute;
    bottom: 24px; right: 26px;
    color: var(--gold);
    font-size: 16px;
    transition: transform 0.25s ease;
  }
  .pillar-card:hover .pillar-arrow { transform: translateX(4px); }

  /* ===================== FOOTER ===================== */
  footer {
    text-align: center;
    margin-top: 16px;
  }
  .footer-nav {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .footer-nav a {
    color: rgba(244, 239, 227, 0.5);
    border-bottom: 1px solid transparent;
  }
  .footer-nav a:hover {
    color: var(--terracotta);
    border-bottom-color: var(--terracotta);
  }
  .footer-nav .sep {
    color: rgba(244, 239, 227, 0.2);
    margin: 0 10px;
  }

    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(244, 239, 227, 0.3)
